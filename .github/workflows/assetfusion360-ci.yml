name: AssetFusion360 CI

on:
  push:
    branches:
      - main
      - capstone-project-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q src/assetfusion360
          python -m py_compile app/assetguard_app.py

      - name: Execute automated regression tests
        run: |
          python -m unittest discover -s tests -p "test_assetguard_ci.py" -v
